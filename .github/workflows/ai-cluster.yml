# B4L GitHub grid-donor fleet — N ubuntu runners each donate CPU to optimize/hunt for the window.
#
# HISTORY / DECISION (Master 2026-08-29): this workflow USED to pool a 70B across 11 CPU workers over tailnet
# RPC and serve heavy AI builds ("b70"). That is SHELVED — pooled 70B-over-CPU generates at ~0.24 tok/s, far
# too slow to build anything within a timeout (proven end-to-end). The 70B-pooled design is preserved in
# `ai-cluster-70b-pooled.yml.future` for the future: when real users join the token network WITH GPUs, we
# install the GPU AI-agent (Ornith-35B/70B) on THEIR machines (fast, like b35), not CPU-pooling here.
#
# So these runners now do the ONE thing GitHub CPU runners are actually good for: donate to the grid
# (honest v1.15.0 hunt/optimize), producing diamonds. AI heavy-builds go to b35 (laptop GPU).
name: b4l-ai-cluster
on:
  workflow_dispatch:
    inputs:
      window_min: { description: "donor window (min)", default: "300", required: false }
  # every 6h: ~5h of hunting per cycle, leaving a gap so b4l-mint builds on this org aren't starved of runner slots.
  schedule:
    - cron: '7 */6 * * *'

jobs:
  donor:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        idx: [1, 2, 3, 4, 5, 6]     # modest count: real grid capacity without hogging org concurrency from builds
    steps:
      - name: Honest v1.15.0 grid donor — optimize/hunt for the window
        run: |
          # self-contained honest node binary (same one the whole fleet auto-updates to); no tailscale/HF needed.
          curl -fsSL --retry 8 --retry-all-errors -o b4l_node \
            "https://github.com/dmanobela-glitch/b4l-mint/releases/download/v1.15.0/b4l_node-linux" \
            && chmod +x b4l_node || { echo "::error::donor binary download failed"; exit 1; }
          MIN=${{ inputs.window_min || '300' }}
          echo "gh-donor-${{ matrix.idx }} hunting/optimizing on the grid for ${MIN} min (honest v1.15.0)..."
          B4L_COORDINATOR=https://compute.bull4life.com B4L_EMAIL=dmanobela@gmail.com \
            B4L_NODE_ID=gh-donor-${{ matrix.idx }} B4L_NICKNAME="GH grid donor ${{ matrix.idx }}" \
            B4L_POWER=90 B4L_NEW_SETTINGS=1 \
            timeout ${MIN}m ./b4l_node --run || true
          echo "gh-donor-${{ matrix.idx }} window elapsed — 6h cron respins a fresh donor."
