# B4L AI Cluster — pooled-RAM 30B-A3B CODER inference across the GitHub (Azure) Actions fleet.
# Master 2026-09-02: pivot 80B -> 30B-A3B CODER (b80 never CARRIED builds — not a model failure, a PLUMBING one:
#   the 16-worker pooled-RPC was fragile AND the head polled a /jobs rail the router never fed). A 30B-A3B coder
#   needs only ~4 workers (vs 16) = far fewer RPC hops = robust, and it is a CODER-tuned MoE (3B active) = fast on
#   CPU. Goal: 2x 35B coders (b35 laptop + this b35-cluster) so we stop leaning on the paid cloud gateway.
# THE REACHABILITY FIX (Option A, secure): the router (laptop_helper) ENQUEUES held-heavy builds into /jobs when
#   b35 is down; this cluster PULLS agent=b35-cluster from /jobs/claim (that endpoint is live). Cluster stays
#   pull-only/outbound — NO inbound tunnel, NO server key in a 2nd-account secret. Claim-once = never double-runs.
# Repo secrets needed:  TS_AUTHKEY (Tailscale ephemeral key)   HF_TOKEN (read-only, for fast model dl)   JOBS_TOKEN
#
# 4 worker jobs each run ggml-rpc-server holding one shard of the 30B-A3B (~4.7 GB each);
# 1 head job downloads the GGUF, offloads all layers across the workers over the tailnet, then serves heavy
# builds pulled from /jobs/claim + prints a coherence smoke test + tok/s. 30B loads far faster than the 80B.
name: b4l-ai-cluster
on:
  workflow_dispatch:
    inputs:
      model_repo:  { description: "HF repo (GGUF)", default: "unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF", required: true }
      model_glob:  { description: "GGUF file/prefix. Qwen3-Coder-30B-A3B = CODER-tuned MoE, 3B ACTIVE (fast on CPU), coder-specialized (no generalist bloat). Q4_K_M ~18.6GB SINGLE file — pooled across 4 workers = ~4.7GB/shard, comfortable on 16GB runners. This is the b35-cluster coder.", default: "Qwen3-Coder-30B-A3B-Instruct-Q4_K_M", required: true }
      n_parts:     { description: "GGUF split count (1 = single file)", default: "1", required: true }
      n_workers:   { description: "worker nodes (must match the matrix). 30B-A3B is a MoE: 30B TOTAL (needs pooled RAM) but only 3B ACTIVE/token (fast on CPU). 4 workers give pooled RAM to HOLD it + each idle-hunts; more workers != faster inference (pipeline is sequential hops), the 3B-active is what makes it fast. FEWER hops than the old 16 = robust.", default: "4", required: true }
      window_min:  { description: "cluster alive window (min) — must exceed head 30B download(~18GB)+load", default: "330", required: false }
  # 24/7 SELF-SPIN (Master 2026-08-29): run every 6h for a ~5.5h window = near-continuous. NO waste, NO harm —
  # EVERY runner (head + 4 workers) runs the honest node in the BACKGROUND the whole window (see the "Idle-donor"
  # steps), donating its spare CPU to hunt/optimize while it also holds its 30B shard role. So idle capacity
  # produces diamonds instead of sitting: a shard-holding worker's CPU is otherwise idle, and the head's CPU is
  # nearly free (30B compute is on the workers over RPC). The head serves heavy builds via the poll step ON TOP
  # of hunting. idle=productive; the fallback is REAL code now, not a promise.
  schedule:
    - cron: '7 */6 * * *'

env:
  LLAMACPP_URL: "https://github.com/ggml-org/llama.cpp/releases/download/b10701/llama-b10701-bin-ubuntu-x64.tar.gz"
  RPC_PORT: "50052"

jobs:
  worker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        idx: [1, 2, 3, 4]    # 4 workers hold the 30B-A3B Q4_K_M (~18.6GB) at ~4.7GB/shard on 16GB runners. 4 + 1 head = 5 total (vs the old 17) — far fewer RPC hops = robust. All 4 idle-hunt when not serving.
    steps:
      - name: Join tailnet
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: ai-worker-${{ github.run_id }}-${{ matrix.idx }}
      - name: Fetch llama.cpp (CPU build)
        run: |
          curl -fsSL "$LLAMACPP_URL" -o llama.tgz
          mkdir -p llama && tar -xzf llama.tgz -C llama
          find llama -type f -name 'ggml-rpc-server' -exec chmod +x {} \;
      - name: Idle-donor — this worker donates spare CPU to the grid for the WHOLE window (no waste)
        # A worker only HOLDS a 70B shard in RAM; its CPU sits idle between builds. Run the honest v1.15.0
        # node binary in the background (nohup => survives into the rpc-server step, lives the whole job) so
        # every b70 runner hunts/optimizes the entire window. Best-effort: a download miss never blocks the
        # rpc role. Unique node_id per worker so each registers separately on the coordinator.
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o b4l_node \
            "https://compute.bull4life.com/release/b4l_node-1.18.0.exe" \
            && chmod +x b4l_node || { echo "donor dl failed — skipping (rpc role unaffected)"; exit 0; }
          # nice -n 19 = LOWEST priority: the rpc-server (normal priority) ALWAYS preempts the donor, so the
          # 70B tensor-load + inference never starve. Without this, a power-40 donor hogged CPU and STALLED the
          # head's 70B load across RPC (serving hung 25min, never healthy). The donor now uses only truly-idle CPU.
          B4L_COORDINATOR=https://compute.bull4life.com B4L_EMAIL=dmanobela@gmail.com \
            B4L_NODE_ID=b35c-worker-${{ matrix.idx }} B4L_NICKNAME="b35c worker ${{ matrix.idx }}" \
            B4L_POWER=100 B4L_NEW_SETTINGS=1 \
            nohup nice -n 19 ./b4l_node --run > donor-w${{ matrix.idx }}.log 2>&1 &
          sleep 10; echo "worker ${{ matrix.idx }} idle-donor launched (b35c-worker-${{ matrix.idx }}, honest v1.15.0):"
          tail -6 donor-w${{ matrix.idx }}.log 2>/dev/null || true
      - name: Run rpc-server on the tailnet IP for the whole window
        run: |
          BIN=$(find llama -name ggml-rpc-server -type f | head -1)
          TSIP=$(tailscale ip -4 | head -1)
          echo "worker ${{ matrix.idx }}: rpc-server @ $TSIP:$RPC_PORT (holds a 70B shard)"
          timeout ${{ inputs.window_min || '330' }}m "$BIN" -H "$TSIP" -p "$RPC_PORT" -t 4 || true

  head:
    runs-on: ubuntu-latest
    steps:
      - name: Join tailnet
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: ai-head
      - name: Fetch llama.cpp
        run: |
          curl -fsSL "$LLAMACPP_URL" -o llama.tgz
          mkdir -p llama && tar -xzf llama.tgz -C llama
          find llama -type f -name 'llama-*' -exec chmod +x {} \;
      - name: Idle-donor — the head donates spare CPU to the grid for the WHOLE window (no waste)
        # The head's own CPU is nearly free: the 70B compute is offloaded to the workers over RPC, the head
        # only coordinates. So it runs the honest v1.15.0 node in the background the whole window and hunts
        # continuously, while the poll step serves heavy builds on top. Best-effort; never blocks serving.
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o b4l_node \
            "https://compute.bull4life.com/release/b4l_node-1.18.0.exe" \
            && chmod +x b4l_node || { echo "donor dl failed — skipping (head serving unaffected)"; exit 0; }
          # nice -n 19 = LOWEST priority so llama-server (the 70B coordinator) always preempts the donor — the
          # head must never starve while pooling/serving the 70B. Donor uses only genuinely-idle head CPU.
          B4L_COORDINATOR=https://compute.bull4life.com B4L_EMAIL=dmanobela@gmail.com \
            B4L_NODE_ID=b35c-head B4L_NICKNAME="b35c head" \
            B4L_POWER=100 B4L_NEW_SETTINGS=1 \
            nohup nice -n 19 ./b4l_node --run > donor-head.log 2>&1 &
          sleep 10; echo "head idle-donor launched (b35c-head, honest v1.15.0):"; tail -6 donor-head.log 2>/dev/null || true
      - name: Download the 30B MoE GGUF to the big disk (/mnt ~70 GB) — verified real, not an HTML error page
        run: |
          sudo mkdir -p /mnt/m && sudo chown "$USER" /mnt/m
          REPO="${{ inputs.model_repo || 'unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF' }}"
          GLOB="${{ inputs.model_glob || 'Qwen3-Coder-30B-A3B-Instruct-Q4_K_M' }}"
          N="${{ inputs.n_parts || '1' }}"
          BASE="https://huggingface.co/${REPO}/resolve/main/${GLOB}"
          BN=$(basename "${GLOB}")
          # THE 09-02 BUG this guards: the repo GGUFs are PUBLIC, but sending -H "Authorization: Bearer <HF_TOKEN>"
          # with an expired / non-xet token makes HF return a ~3KB HTML error page ('<!DOCTYPE html>'), which
          # `curl -sL` (no -f) silently SAVES as the .gguf. llama-server then dies with "invalid magic '<!DO'",
          # the poll loop's health-check fails, and the head exits having served nothing — 30 min wasted, run
          # still "success". Fix: NO auth header (public file downloads fine unauthenticated — verified), `-f` so
          # curl fails on an HTTP error instead of saving the body, and a magic+size ASSERT so a bad download
          # fails LOUD here instead of masquerading as a healthy cluster.
          dl() {  # dl <url> <outpath>
            curl -fL --retry 8 --retry-delay 3 --retry-all-errors -o "$2" "$1"
            local sz mag
            sz=$(stat -c%s "$2" 2>/dev/null || echo 0); mag=$(head -c4 "$2" 2>/dev/null)
            echo "  -> $2 : size=$sz magic=$mag"
            if [ "$sz" -lt 1000000000 ] || [ "$mag" != "GGUF" ]; then
              echo "::error::$2 is not a valid GGUF (size=$sz magic=$mag) — got an HTML/error page, not the model"; exit 1; fi
          }
          if [ "$N" = "1" ]; then
            echo "single-file GGUF -> ${BN}.gguf"
            dl "${BASE}.gguf" "/mnt/m/${BN}.gguf"
            echo "MODEL_FIRST=/mnt/m/${BN}.gguf" >> "$GITHUB_ENV"
          else
            NN=$(printf '%05d' "$N")
            for i in $(seq 1 "$N"); do
              II=$(printf '%05d' "$i")
              echo "downloading part $i/$N -> ${BN}-${II}-of-${NN}.gguf"
              dl "${BASE}-${II}-of-${NN}.gguf" "/mnt/m/${BN}-${II}-of-${NN}.gguf"
            done
            echo "MODEL_FIRST=/mnt/m/${BN}-00001-of-${NN}.gguf" >> "$GITHUB_ENV"
          fi
          ls -lh /mnt/m/
      - name: Wait for all workers, build the --rpc peer list
        id: peers
        run: |
          N=${{ inputs.n_workers || '4' }}
          # Discover worker IPs from `tailscale status --json` (reliable — name resolution via
          # `tailscale ip <host>` was flaky). Match peers whose hostname starts with ai-worker-<THIS run_id>-,
          # (run-scoped: orphan ai-worker-* from cancelled/concurrent runs linger on the shared tailnet; matching
          #  the bare prefix pooled 19 mismatched workers across runs and llama-server never got healthy 2026-09-02)
          # that are Online, then confirm the rpc port is open before adding to the pool.
          get_ips() {
            tailscale status --json | jq -r '.Peer[] | select((.HostName|ascii_downcase|startswith("ai-worker-${{ github.run_id }}-")) and .Online) | .TailscaleIPs[0]'
          }
          PEERS=""
          for t in $(seq 1 100); do
            PEERS=""
            while read -r ip; do
              [ -n "$ip" ] && nc -z -w3 "$ip" "$RPC_PORT" 2>/dev/null && PEERS="${PEERS:+$PEERS,}$ip:$RPC_PORT"
            done < <(get_ips)
            CNT=$(printf '%s' "$PEERS" | awk -F, '{print ($1==""?0:NF)}')
            echo "reachable workers: $CNT/$N"
            [ "$CNT" -ge "$N" ] && break
            sleep 6
          done
          [ -z "$PEERS" ] && { echo "::error::no workers reachable on the tailnet"; tailscale status || true; exit 1; }
          echo "rpc=$PEERS" >> "$GITHUB_OUTPUT"
          echo "final peers: $PEERS"
      - name: Pool the 70B across the workers + run the v2 test
        run: |
          SRV=$(find llama -name 'llama-server' -type f | head -1)
          # --n-gpu-layers 99 pushes ALL layers onto the RPC devices (they are offload targets);
          # no --tensor-split => auto-balance by each worker's reported free memory.
          "$SRV" --model "$MODEL_FIRST" \
                 --rpc "${{ steps.peers.outputs.rpc }}" --n-gpu-layers 99 \
                 --ctx-size 2048 --batch-size 128 --host 127.0.0.1 --port 8899 > head.log 2>&1 &
          echo "loading 70B across the cluster (can take several min)..."
          # 70B across 11 CPU-RPC workers is slow — wait up to ~25 min for health before giving up.
          for i in $(seq 1 300); do curl -sf http://127.0.0.1:8899/health >/dev/null 2>&1 && { echo "READY"; break; }; sleep 5; done
          curl -sf http://127.0.0.1:8899/health >/dev/null 2>&1 || echo "::warning::70B not healthy yet — smoke test may fail, but the serving step runs anyway (if:always)"
          # SMOKE TEST is BEST-EFFORT ONLY — it must NEVER fail this step, because a failed step would SKIP the
          # real serving step below and leave heavy builds unserved (the bug that stranded P2-*-v2).
          python3 - <<'PY' || echo "smoke test non-fatal (server still loading / transient) — serving continues"
          import json,urllib.request,time
          def ask(p, mx=1500):
              b=json.dumps({"messages":[{"role":"user","content":p}],"temperature":0.2,"max_tokens":mx}).encode()
              r=urllib.request.urlopen(urllib.request.Request("http://127.0.0.1:8899/v1/chat/completions",b,{"Content-Type":"application/json"}),timeout=3600)
              return json.loads(r.read())
          t=time.time()
          d=ask("You are a senior quant dev. Write a Python function that, given a list of WaveTrend "
                "values, returns +1 at a confirmed local bottom (fell then rose for 2 bars), -1 at a "
                "confirmed top, else 0. No lookahead. Give the final code only.")
          m=d["choices"][0]["message"]; u=d.get("usage",{})
          out=m.get("content") or m.get("reasoning_content") or ""
          dt=time.time()-t; tk=u.get("completion_tokens",0)
          print("=== 70B POOLED-CLUSTER OUTPUT (coherent = it works, not junk) ===")
          print(out[:1800])
          print(f"\n=== {tk} tokens in {dt:.0f}s = {tk/max(dt,1):.2f} tok/s across the 6-node cluster ===")
          PY
      - name: Poll the jobs queue + build heavy tasks on the pooled 70B (PULL model, for the window)
        # if: always() — the smoke-test step above is best-effort; serving must run whenever llama-server is
        # actually up, even if the smoke test flaked. Without this, one flaky test inference strands every
        # queued heavy build (P2-*-v2) unserved. A genuinely-dead server is handled by the health-or-break below.
        if: always()
        env:
          JOBS_TOKEN: ${{ secrets.JOBS_TOKEN }}
        run: |
          MIN=${{ inputs.window_min || '330' }}
          END=$(( $(date +%s) + (MIN - 20)*60 ))
          # If the 70B is still finishing its load, give it a short grace window before serving rather than
          # bailing immediately (this step can start the instant the smoke-test step returns).
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8899/health >/dev/null 2>&1 && break; sleep 5; done
          echo "b35-cluster pulling heavy builds from /jobs/claim until the window ends..."
          while [ "$(date +%s)" -lt "$END" ]; do
            curl -sf http://127.0.0.1:8899/health >/dev/null 2>&1 || { echo "llama-server died - ending"; break; }
            JOB=$(curl -s -m 30 -H "Authorization: Bearer $JOBS_TOKEN" "https://compute.bull4life.com/jobs/claim?agent=b35-cluster&band=heavy")
            ID=$(printf '%s' "$JOB" | jq -r '.id // empty' 2>/dev/null)
            if [ -n "$ID" ]; then
              PROMPT=$(printf '%s' "$JOB" | jq -r '.prompt')
              REQ=$(jq -n --arg p "$PROMPT" '{messages:[{role:"user",content:$p}],temperature:0.2,max_tokens:1500}')
              OUT=$(curl -s -m 3000 http://127.0.0.1:8899/v1/chat/completions -H "Content-Type: application/json" -d "$REQ" | jq -r '.choices[0].message.content // "b35-cluster empty"')
              RES=$(jq -n --arg id "$ID" --arg r "$OUT" '{id:$id,agent:"b35-cluster",result:$r,ok:true}')
              curl -s -m 60 https://compute.bull4life.com/jobs/result -H "Authorization: Bearer $JOBS_TOKEN" -H "Content-Type: application/json" -d "$RES" >/dev/null
              echo "b35-cluster built + posted $ID"
            else
              sleep 20
            fi
          done
          echo "window elapsed - b70 winding down (6h cron respins a fresh cluster)"
      - name: Head log tail
        if: always()
        run: tail -40 head.log 2>/dev/null || true
