# enginebunnies.yml - engine's free research workers on ONE GitHub-hosted runner: 6 since 10-02 (bunny13..18;
# 19 and 20 parked, admin's memory order), in the b4llab.slice memory cap.
# engine 2026-10-01, admin's order: "8 more space bunny per github runner". Lives in the PUBLIC repo
# dmanobela-glitch/-b4l-ai-cluster (hosted minutes are free only in public repos); mirror kept in the engine repo
# at compute/fleet_workflows/enginebunnies.yml.
# - ONE job, 6 background loops (a matrix would take 6 runners). Each loop = one fresh `claude -p` per task row,
#   model locked to the free OpenRouter stealth model; no Anthropic credential exists here (cannot bill Claude).
# - The job is capped at 350 min; JOB_END stops new rows ~5h45m in, so no run is killed mid-task. The cron restarts
#   it every 6 h; the concurrency group keeps two copies from overlapping.
# - PUBLIC LOGS: nothing private is printed. Keys are repo secrets, the kit comes from the CC hub (not this repo),
#   every worker writes only to its own log files, and the summary prints counts only.
name: enginebunnies
on:
  schedule:
    - cron: '20 */6 * * *'
  workflow_dispatch:
    inputs:
      model:
        description: 'free OpenRouter model id for the workers (empty = the kit default)'
        required: false
        default: ''
concurrency:
  group: enginebunnies
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  bunnies:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install claude cli
        run: npm i -g @anthropic-ai/claude-code > /dev/null 2>&1 && claude --version
      - name: fetch kit
        env:
          CC_AGENT_TOKEN: ${{ secrets.CC_AGENT_TOKEN }}
        run: |
          set -eu
          umask 077
          printf 'CC_AGENT_TOKEN=%s\n' "$CC_AGENT_TOKEN" > "$HOME/cc.env"
          mkdir -p "$HOME/bunnies"
          curl -sf -H "Authorization: Bearer $CC_AGENT_TOKEN" -H "X-CC-Agent: engine_spacebunny13" \
            "https://bull4life.com/cc/api/artifacts/read?rel=engine/current/kit/bunny-kit.md" \
            | jq -r .body | base64 -d | tar xz -C "$HOME/bunnies"
          chmod +x "$HOME/bunnies/run_gh.sh"
          echo "kit files: $(find "$HOME/bunnies" -type f | wc -l)"
      - name: run 6 bunnies
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BUNNY_MODEL: ${{ inputs.model }}
        run: |
          # SANDBOX (lab run 36889040368: a runner got a shutdown signal 9 min after its workers started). Workers run
          # as the unprivileged user `lab` with no sudo, so no worker command can stop the runner or its processes.
          sudo useradd -m -s /bin/bash lab
          sudo cp -a "$HOME/bunnies" "$HOME/cc.env" /home/lab/
          sudo chown -R lab:lab /home/lab
          export JOB_END=$(( $(date +%s) + 345*60 ))
          # __B4L_LAB_MEMGUARD__ (ported from enginelab.yml, engine 10-02): runs 36874339475, 36887684267, 36936790147,
          # 36970250865 ALL failed - "runner has received a shutdown signal" ~50 min after 8 workers started (the
          # memory death the lab had). Admin 10-02: 2 fewer workers per box, memory cap at 15/16. Every worker runs in
          # ONE cgroup, b4llab.slice: MemoryMax 15/16 of the box, no swap, MemoryHigh 14/16; the kernel kills a worker
          # process INSIDE it and the runner agent outside keeps its memory. A memory line every minute.
          MT=$(awk '/MemTotal/{print $2}' /proc/meminfo)
          printf '[Slice]\nMemoryAccounting=yes\nMemoryHigh=%dK\nMemoryMax=%dK\nMemorySwapMax=0\n' $(( MT*14/16 )) $(( MT*15/16 )) \
            | sudo tee /etc/systemd/system/b4llab.slice > /dev/null
          sudo systemctl daemon-reload
          ( while sleep 60; do echo "MEM $(date -u +%H:%M) used/total $(free -m | awk '/Mem/{print $3"/"$2}') swap $(free -m | awk '/Swap/{print $3"/"$2}') load $(cut -d' ' -f1 /proc/loadavg) lab_procs $(pgrep -c -u lab) slice_mb $(( $(cat /sys/fs/cgroup/b4llab.slice/memory.current 2>/dev/null || echo 0) / 1048576 )) slice_oom $(awk '/^oom_kill /{print $2}' /sys/fs/cgroup/b4llab.slice/memory.events 2>/dev/null)"; done ) &
          # 6 workers, not 8: bunny19 and bunny20 stay unused
          for n in 13 14 15 16 17 18; do
            # run 1 (10-01) starved the runner ("lost communication" at 6 min): workers run niced, and the
            # kernel's OOM killer takes a worker first, never the runner agent
            ( echo 1000 > /proc/self/oom_score_adj
              exec sudo --preserve-env=OPENROUTER_API_KEY,JOB_END,BUNNY_MODEL systemd-run --scope -q \
                --slice=b4llab.slice -- sudo -u lab -H --preserve-env=OPENROUTER_API_KEY,JOB_END,BUNNY_MODEL \
                env "PATH=$PATH" setsid -w nice -n 15 bash /home/lab/bunnies/run_gh.sh "engine_spacebunny$n" ) > /dev/null 2>&1 &
            sleep 20
          done
          # the cap must not cost the window: if systemd-run put nothing in the slice, start the workers uncapped.
          # Count the slice's whole SUBTREE (cgroup v2 puts the processes in run-*.scope children).
          sleep 10
          SLICE_PROCS=$( (cat /sys/fs/cgroup/b4llab.slice/cgroup.procs /sys/fs/cgroup/b4llab.slice/*/cgroup.procs 2>/dev/null || true) | wc -l)
          if [ "$SLICE_PROCS" -eq 0 ]; then
            echo "::warning::b4llab.slice is empty, workers start WITHOUT the memory cap"
            for n in 13 14 15 16 17 18; do
              ( echo 1000 > /proc/self/oom_score_adj
                exec sudo -u lab -H --preserve-env=OPENROUTER_API_KEY,JOB_END,BUNNY_MODEL env "PATH=$PATH" \
                  setsid -w nice -n 15 bash /home/lab/bunnies/run_gh.sh "engine_spacebunny$n" ) > /dev/null 2>&1 &
              sleep 20
            done
          else
            echo "slice cap: $(cat /sys/fs/cgroup/b4llab.slice/memory.max) bytes, $SLICE_PROCS procs in it"
          fi
          echo "6 workers started"
          wait
          echo "all workers ended"
      - name: summary (counts only)
        if: always()
        run: |
          # /home/lab is 0750 (lab only), so the glob runs under sudo
          for d in $(sudo sh -c 'ls -d /home/lab/bunnies/engine_spacebunny*/ 2>/dev/null'); do
            sudo test -f "$d/logs/runner.log" || continue
            echo "$(basename "$d"): starts=$(sudo grep -c ' start ' "$d/logs/runner.log") ends=$(sudo grep -c ' end ' "$d/logs/runner.log")"
          done
