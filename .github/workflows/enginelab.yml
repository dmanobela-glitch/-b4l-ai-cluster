# enginelab.yml - engine's free LAB fleet: 4 hosted runners x 6 workers (slots 0-5 of bunny21..bunny52; 6 since admin 10-02). engine 2026-10-01, admin:
# "spin more space bunnies ... they can test by them self". Lives in the PUBLIC repo -b4l-ai-cluster (free minutes);
# mirror in the engine repo at compute/fleet_workflows/enginelab.yml.
# - The engine source rides ONLY encrypted (orphan branch `labkit`, labkit.enc, key = repo secret B4L_KIT_KEY;
#   tools/lab_kit.py builds it). It is decrypted into ~/engine on the runner, never into this repo.
# - Workers are the same run_gh.sh loop as runner A with ROLE=lab: check/build stages are free-model runs,
#   test/replicate stages are MECHANICAL (tools/lab_eval.py). tools/lab_dispatch.py (laptop) feeds them.
# - PUBLIC LOGS: nothing private is printed; every worker writes to its own files; the summary prints counts only.
# - mode=smoke runs ONE short lab_eval on one runner (proves the harness end to end) and prints only the verdict line.
name: enginelab
# a storm wave's run is named "... storm wave ...": bunny_storm.py stop cancels only those, never the regular lab run
run-name: ${{ inputs.until && format('enginelab storm wave {0}', inputs.runners) || format('enginelab {0}', inputs.mode || 'lab') }}
on:
  schedule:
    - cron: '35 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'lab (4 runners x 6 workers) or smoke (one harness check)'
        required: false
        default: 'lab'
      runners:
        description: 'extra wave: JSON list of lab runner numbers (workers 21+8R..28+8R); empty = the regular 0-3'
        required: false
        default: ''
      until:
        description: 'extra wave: epoch s; the wave re-dispatches itself after each window until then (empty = once)'
        required: false
        default: ''
      model:
        description: 'free OpenRouter model id for the workers (empty = the kit default)'
        required: false
        default: ''
# the regular cron run keeps group enginelab-lab; an extra wave gets its own group per runner list
concurrency:
  group: enginelab-${{ inputs.mode || 'lab' }}${{ inputs.runners && format('-{0}', inputs.runners) || '' }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  smoke:
    if: ${{ inputs.mode == 'smoke' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dmanobela-glitch/-b4l-ai-cluster
          ref: labkit
          path: payload
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: deps
        run: |
          pip install --quiet numpy pandas matplotlib scipy ccxt
          npm i -g @anthropic-ai/claude-code > /dev/null 2>&1 && claude --version
      - name: decrypt engine
        env:
          KIT_KEY: ${{ secrets.B4L_KIT_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/engine"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in payload/labkit.enc -pass "pass:$KIT_KEY" | tar -xz -C "$HOME/engine"
          rm -rf payload
          echo "engine files: $(find "$HOME/engine" -type f | wc -l)"
      - name: sandbox check (the lab job's worker user)
        run: |
          sudo useradd -m -s /bin/bash lab
          export JOB_END=1 ROLE=lab ULTRA=1 OPENROUTER_API_KEY=x
          ( echo 1000 > /proc/self/oom_score_adj
            exec sudo -u lab -H --preserve-env=OPENROUTER_API_KEY,JOB_END,ROLE,ULTRA env "PATH=$PATH" \
              setsid -w nice -n 15 bash -c 'echo "user=$(whoami) home=$HOME role=$ROLE ultra=$ULTRA nice=$(nice) oom=$(cat /proc/self/oom_score_adj)"; python3 -c "import numpy, pandas, scipy; print(\"py ok\")"; echo "claude $(claude --version 2>&1 | head -1)"; sudo -n true 2>/dev/null && echo "SUDO OPEN" || echo "no sudo"; w=$(pgrep -f Runner.Worker | head -1); kill -0 "$w" 2>/dev/null && echo "CAN SIGNAL runner" || echo "cannot signal runner (pid $w)"' )
          echo "sandbox rc $?"
      - name: harness smoke (2 tags, identical trees, an ON that must act)
        run: |
          cp -a "$HOME/engine" "$HOME/t_base"; cp -a "$HOME/engine" "$HOME/t_patched"
          python3 "$HOME/engine/tools/lab_eval.py" --base "$HOME/t_base" --patched "$HOME/t_patched" \
            --on-env '{"B4L_TP_TAKER_PCT": "0.2"}' --half screen --tags 2 --jobs 3 --out "$HOME/t_out" > "$HOME/t_log.txt" 2>&1 || true
          # exception class lines only (no settings, no source): enough to see WHY a run died
          cat "$HOME/t_log.txt" "$HOME"/t_out/*/log_*.txt 2>/dev/null | grep -E '^[A-Za-z_.]*(Error|Exception|Exit)[: ]|"error"' | cut -c1-160 | sort | uniq -c | head -8
          python3 - <<'PY'
          import json, os
          p = os.path.expanduser('~/t_out/lab_result.json')
          if not os.path.isfile(p):
              print('SMOKE: no result'); raise SystemExit(1)
          s = json.load(open(p))
          print('SMOKE:', json.dumps({k: s[k] for k in ('off_identity', 'acts', 'errored_rows', 'errors', 'paired_rows', 'minutes')}))
          raise SystemExit(0 if s['off_identity'].split()[0] == s['off_identity'].split()[-1] and s['acts'] and not s['errored_rows'] else 1)
          PY

  lab:
    # the cron run (runners 0-3) belongs to the personal repo only: a copy of this file in another repo (the
    # Bull4Life-Engine org since 10-04) runs dispatched waves only, or runners 0-3 would run twice
    if: ${{ inputs.mode != 'smoke' && (github.event_name != 'schedule' || github.repository == 'dmanobela-glitch/-b4l-ai-cluster') }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners || '[0, 1, 2, 3]') }}
    steps:
      - name: one copy per runner (wait while another run holds this runner)
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_NO: ${{ matrix.runner }}
        run: |
          # __B4L_LAB_ONE_COPY__ (engine 10-02): a replacement for a dead runner (dispatched with runners=[R], its own
          # concurrency group) and the regular cron run (group enginelab-lab, runners 0-3) can both hold runner R, and
          # two copies of its 6 workers would work the same claims. While another run has `lab (R)` in progress, wait
          # (one API look per 5 min), then start; JOB_T0 keeps the workers' JOB_END inside this job's 350-min cap.
          echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
          live() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/enginelab.yml/runs?status=in_progress&per_page=50" \
              -q '.workflow_runs[].id' 2>/dev/null | grep -vx "$GITHUB_RUN_ID" | while read -r id; do
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=50" \
                  -q ".jobs[] | select(.status==\"in_progress\" and .name==\"lab ($RUNNER_NO)\") | .id" 2>/dev/null
              done | wc -l
          }
          end=$(( $(date +%s) + 300*60 ))
          while [ "$(live)" -gt 0 ] && [ "$(date +%s)" -lt "$end" ]; do
            echo "runner $RUNNER_NO is live in another run: waiting ($(date -u +%H:%M))"
            sleep 300
          done
          echo "runner $RUNNER_NO free: starting ($(date -u +%H:%M))"
      - uses: actions/checkout@v4
        with:
          repository: dmanobela-glitch/-b4l-ai-cluster
          ref: labkit
          path: payload
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: deps + claude cli
        run: |
          pip install --quiet numpy pandas matplotlib scipy ccxt
          npm i -g @anthropic-ai/claude-code > /dev/null 2>&1 && claude --version
      - name: decrypt engine (a git baseline for the workers' diffs)
        env:
          KIT_KEY: ${{ secrets.B4L_KIT_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/engine"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in payload/labkit.enc -pass "pass:$KIT_KEY" | tar -xz -C "$HOME/engine"
          rm -rf payload
          cd "$HOME/engine" && git init -q && git add -A && git -c user.name=lab -c user.email=lab@localhost commit -qm baseline
          echo "engine files: $(git ls-files | wc -l)"
      - name: fetch worker kit
        env:
          CC_AGENT_TOKEN: ${{ secrets.CC_AGENT_TOKEN }}
        run: |
          set -eu
          umask 077
          printf 'CC_AGENT_TOKEN=%s\n' "$CC_AGENT_TOKEN" > "$HOME/cc.env"
          mkdir -p "$HOME/bunnies"
          curl -sf -H "Authorization: Bearer $CC_AGENT_TOKEN" -H "X-CC-Agent: engine_spacebunny21" \
            "https://bull4life.com/cc/api/artifacts/read?rel=engine/current/kit/bunny-kit.md" \
            | jq -r .body | base64 -d | tar xz -C "$HOME/bunnies"
          echo "kit files: $(find "$HOME/bunnies" -type f | wc -l)"
      - name: run 6 lab workers
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RUNNER_NO: ${{ matrix.runner }}
          BUNNY_MODEL: ${{ inputs.model }}
          UNTIL: ${{ inputs.until }}
          # admin 10-04 role names: repo variable B4L_NEW_NAMES=1 -> engine_labNN (NN = 6R+i+1, tools/fleet_names.py);
          # unset -> the old engine_spacebunny(21+8R+i)
          NEW_NAMES: ${{ vars.B4L_NEW_NAMES }}
        run: |
          wname() { if [ "$NEW_NAMES" = 1 ]; then printf 'engine_lab%02d' $(( 6*RUNNER_NO + $1 + 1 )); else echo "engine_spacebunny$(( 21 + 8*RUNNER_NO + $1 ))"; fi; }
          # SANDBOX (lab run 36889040368: runner 0 got a shutdown signal 9 min after its workers started). The workers
          # run as the unprivileged user `lab` with no sudo, so no worker command can stop the runner or its processes.
          sudo useradd -m -s /bin/bash lab
          sudo cp -a "$HOME/bunnies" "$HOME/engine" "$HOME/cc.env" /home/lab/
          sudo chown -R lab:lab /home/lab
          export JOB_END=$(( $(date +%s) + 345*60 )) ROLE=lab
          # an extra wave never outlives its deadline (bunny_storm.py `until`)
          if [ -n "$UNTIL" ] && [ "$UNTIL" -lt "$JOB_END" ]; then export JOB_END=$UNTIL; fi
          # __B4L_LAB_ONE_COPY__: time spent waiting for another copy of this runner counts against the job's cap
          if [ -n "$JOB_T0" ] && [ $(( JOB_T0 + 340*60 )) -lt "$JOB_END" ]; then export JOB_END=$(( JOB_T0 + 340*60 )); fi
          # __B4L_LAB_MEMGUARD__ v2 (admin 10-02 "memory cap at 15/16 GB"). v1 (10-01) added 8 GB swap so a spike would
          # slow the box instead of killing it; run 36967217688 lab (2) still died 15 min in (4.7 -> 13.4 GB in 2 min,
          # then 15.8 GB + 10 GB swap -> shutdown signal), so swap only delayed it. Now every lab process runs inside
          # ONE cgroup, b4llab.slice: MemoryMax = 15/16 of the box, no swap for it, MemoryHigh = 14/16 (the kernel
          # reclaims/throttles there first). When the slice is full the kernel kills a lab process INSIDE it; the runner
          # agent sits outside and keeps its memory. A memory line every minute (slice use + its OOM kills); 2 min hid
          # a 4.7 -> 13.4 GB spike between two lines.
          MT=$(awk '/MemTotal/{print $2}' /proc/meminfo)
          printf '[Slice]\nMemoryAccounting=yes\nMemoryHigh=%dK\nMemoryMax=%dK\nMemorySwapMax=0\n' $(( MT*14/16 )) $(( MT*15/16 )) \
            | sudo tee /etc/systemd/system/b4llab.slice > /dev/null
          sudo systemctl daemon-reload
          ( while sleep 60; do echo "MEM $(date -u +%H:%M) used/total $(free -m | awk '/Mem/{print $3"/"$2}') swap $(free -m | awk '/Swap/{print $3"/"$2}') load $(cut -d' ' -f1 /proc/loadavg) lab_procs $(pgrep -c -u lab) slice_mb $(( $(cat /sys/fs/cgroup/b4llab.slice/memory.current 2>/dev/null || echo 0) / 1048576 )) slice_oom $(awk '/^oom_kill /{print $2}' /sys/fs/cgroup/b4llab.slice/memory.events 2>/dev/null)"; done ) &
          # 6 workers per box, not 8 (admin 10-02; run 36937576079: runners 0 and 2 died of memory at 15.8/16 GB, ~90
          # lab procs). Slots 6 and 7 (engine_spacebunny 21+8R+6, +7) stay unused; bcc.mjs `next` also takes no new
          # task while used RAM is at or above 15/16 of the box.
          for i in 0 1 2 3 4 5; do
            n=$(wname $i)
            # A/B (engine 10-01): ONE worker per runner runs ultracode (multi-agent workflows), the other 7 without.
            # It was every odd worker (4 per runner) until the memory deaths above.
            if [ "$i" -eq 0 ]; then export ULTRA=1; else export ULTRA=; fi
            # niced + first in line for the OOM killer, so the runner agent survives (runner A run 1 starved at 6 min)
            # systemd-run --scope runs the command itself (env inherited) in a new scope under b4llab.slice; every child
            # (claude, sub-agents, backtests) stays in that cgroup
            ( echo 1000 > /proc/self/oom_score_adj
              exec sudo --preserve-env=OPENROUTER_API_KEY,JOB_END,ROLE,ULTRA,BUNNY_MODEL systemd-run --scope -q \
                --slice=b4llab.slice -- sudo -u lab -H --preserve-env=OPENROUTER_API_KEY,JOB_END,ROLE,ULTRA,BUNNY_MODEL \
                env "PATH=$PATH" setsid -w nice -n 15 bash /home/lab/bunnies/run_gh.sh "$n" ) > /dev/null 2>&1 &
            sleep 20
          done
          # the cap must not cost the window: if systemd-run put nothing in the slice, start the workers uncapped.
          # Count the slice's whole SUBTREE: on cgroup v2 the processes sit in run-*.scope children and the slice's own
          # cgroup.procs is always empty (run 36969134267 lab (2) read 0 there, started 6 uncapped duplicates beside the
          # 6 capped workers, and died 23 min in).
          sleep 10
          SLICE_PROCS=$( (cat /sys/fs/cgroup/b4llab.slice/cgroup.procs /sys/fs/cgroup/b4llab.slice/*/cgroup.procs 2>/dev/null || true) | wc -l)
          if [ "$SLICE_PROCS" -eq 0 ]; then
            echo "::warning::b4llab.slice is empty, workers start WITHOUT the memory cap"
            for i in 0 1 2 3 4 5; do
              n=$(wname $i)
              if [ "$i" -eq 0 ]; then export ULTRA=1; else export ULTRA=; fi
              ( echo 1000 > /proc/self/oom_score_adj
                exec sudo -u lab -H --preserve-env=OPENROUTER_API_KEY,JOB_END,ROLE,ULTRA,BUNNY_MODEL env "PATH=$PATH" \
                  setsid -w nice -n 15 bash /home/lab/bunnies/run_gh.sh "$n" ) > /dev/null 2>&1 &
              sleep 20
            done
          else
            echo "slice cap: $(cat /sys/fs/cgroup/b4llab.slice/memory.max) bytes, $SLICE_PROCS procs in it"
          fi
          echo "6 lab workers started on runner $RUNNER_NO"
          wait
          echo "all workers ended"
      - name: summary (counts only)
        if: always()
        run: |
          # /home/lab is 0750 (lab only), so the glob runs under sudo
          sudo dmesg 2>/dev/null | grep -iE 'out of memory|killed process|oom' | tail -5 || true
          for d in $(sudo sh -c 'ls -d /home/lab/bunnies/engine_*/ 2>/dev/null'); do
            sudo test -f "$d/logs/runner.log" || continue
            echo "$(basename "$d"): starts=$(sudo grep -c ' start ' "$d/logs/runner.log") ends=$(sudo grep -c ' end ' "$d/logs/runner.log")"
          done

  # __B4L_STORM_RESPAWN__ (engine 10-01): an extra wave (tools/bunny_storm.py) re-dispatches itself after each window
  # until its `until` deadline, like the donate grid's respawn. A cancelled run does not respawn: cancel = stop.
  respawn:
    needs: [lab]
    if: ${{ always() && !cancelled() && inputs.until != '' && inputs.mode != 'smoke' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: next window (only before the deadline)
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNERS: ${{ inputs.runners }}
          UNTIL: ${{ inputs.until }}
          MODEL: ${{ inputs.model }}
        run: |
          if [ $(( UNTIL - $(date +%s) )) -lt 1800 ]; then echo "storm deadline reached, no respawn"; exit 0; fi
          # ONE run per runner from here on: `needs: [lab]` waits for the whole matrix, so in a 5-runner run a runner
          # that died at minute 10 sat idle until the last one ended (run 36894435217: 4 of 5 dead from 17:05 to 17:39).
          for r in $(echo "$RUNNERS" | jq -r '.[]'); do
            gh workflow run enginelab.yml -R "$GITHUB_REPOSITORY" -f mode=lab -f runners="[$r]" -f until="$UNTIL" -f model="$MODEL" \
              && echo "runner $r: next window dispatched" || echo "::warning::runner $r: respawn dispatch failed"
          done
