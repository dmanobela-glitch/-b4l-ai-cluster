# site_storm.yml - site's BUNNY STORM wave (admin 10-01 via engine: lend donate runners to the spacebunny fleet for 24 h).
# Started by site_dispatch.py storm_fill (entry owner "site" in ~/B4L_Bunnies_shared/registry/storm_waves.json).
# 10-04: site workers by role name. Runs on Bull4Life-Engine/b4l-lab and, while that org queues every new job, on
# the personal repo too (disjoint runner lists, never the same worker twice). Secrets are site's own SITE_*.
# - Matrix of runners; runner R (0-3) hosts ONE worker site_cpu(R+1): R0-1 merge, R2-3 fix; 16 runners, R = position in WORKERS below: site_merge01-05, site_fix01-10, site_marketing01 (role names 10-04) (admin 10-02 reorg: fewer
#   workers, each with room for its own sub-agents; names say cpu/gpu). 10-02: 4 per runner died after 13-33 min, so a watchdog
#   that kills the heaviest worker before memory or disk runs out, and a resource line every 5 min in the log. Lanes: kit/lanes_gh.json (box gh-storm):
#   code and research lanes only (security, scout, audit-site, audit-cc, copy-qa, marketing), no media renders.
# - Free OpenRouter model only (`model` input, kit default if empty); no Anthropic credential exists here.
# - SANDBOX (engine's lab fix): workers run as the unprivileged user `lab`, niced, first for the OOM killer, so no worker
#   can stop or starve the runner. Dispatch (site_dispatch.py on the laptop) gives them rows only while the storm is on.
# - PUBLIC LOGS: nothing private is printed; workers write only to their own log files; the summary prints counts.
name: site_storm
run-name: ${{ inputs.until && format('site storm wave {0}', inputs.runners) || 'site storm (no deadline)' }}
on:
  workflow_dispatch:
    inputs:
      runners:
        description: 'JSON list of runner numbers, e.g. [0, 1]'
        default: '[0]'
      until:
        description: 'storm deadline, epoch s; the wave re-dispatches itself after each window until then'
        default: ''
      model:
        description: 'free OpenRouter model id for the workers (empty = the kit default)'
        default: ''
concurrency:
  group: site-storm-${{ inputs.runners }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  wave:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners || '[0]') }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install claude cli
        run: |
          npm i -g @anthropic-ai/claude-code > /dev/null 2>&1 && claude --version
          [ -x /usr/bin/chromium ] || sudo ln -sf "$(command -v google-chrome)" /usr/bin/chromium
      - name: fetch kit
        env:
          CC_AGENT_TOKEN: ${{ secrets.SITE_CC_AGENT_TOKEN }}
        run: |
          set -eu
          umask 077
          mkdir -p "$HOME/sitefleet"
          printf 'CC_AGENT_TOKEN=%s\n' "$CC_AGENT_TOKEN" > "$HOME/sitefleet/cc.env"
          curl -sf -H "Authorization: Bearer $CC_AGENT_TOKEN" -H "X-CC-Agent: site_merge01" \
            "https://bull4life.com/cc/api/artifacts/read?rel=site/current/kit/site-spacebunny-kit.txt" \
            | jq -r .body | base64 -d | tar xz -C "$HOME/sitefleet"
          echo "kit files: $(find "$HOME/sitefleet" -type f | wc -l)"
      - name: run the storm worker
        env:
          OR_KEY_1: ${{ secrets.SITE_OR_KEY_1 }}
          OR_KEY_2: ${{ secrets.SITE_OR_KEY_2 }}
          OR_KEY_3: ${{ secrets.SITE_OR_KEY_3 }}
          RUNNER_NO: ${{ matrix.runner }}
          BUNNY_MODEL: ${{ inputs.model }}
          UNTIL: ${{ inputs.until }}
        run: |
          set +e
          # admin 10-02: spread the storm over the 3 named OpenRouter accounts, one per runner in turn
          # (OR_KEY_1 Dmanobleagb, OR_KEY_2 bull4lifeb4l, OR_KEY_3 dmanobela). No fallback: engine's key is not ours.
          case $(( RUNNER_NO % 3 )) in 0) K=$OR_KEY_1;; 1) K=$OR_KEY_2;; *) K=$OR_KEY_3;; esac
          [ -n "$K" ] || { echo "::error::no SITE_OR_KEY for runner $RUNNER_NO"; exit 1; }
          export OPENROUTER_API_KEY=$K
          unset OR_KEY_1 OR_KEY_2 OR_KEY_3 K
          sudo useradd -m -s /bin/bash lab
          sudo cp -a "$HOME/sitefleet" /home/lab/
          sudo chown -R lab:lab /home/lab
          export JOB_END=$(( $(date +%s) + 345*60 ))
          if [ -n "$UNTIL" ] && [ "$UNTIL" -lt "$JOB_END" ]; then export JOB_END=$UNTIL; fi
          P="$HOME/pids"; mkdir -p "$P"
          start() {
            ( echo 1000 > /proc/self/oom_score_adj
              exec sudo -u lab -H --preserve-env=OPENROUTER_API_KEY,JOB_END,BUNNY_MODEL env "PATH=$PATH" \
                setsid -w nice -n 15 bash /home/lab/sitefleet/run_gh.sh "$1" ) > /dev/null 2>&1 < /dev/null &
            echo $! > "$P/$1"; }
          trap 'echo "step got TERM at $(date -u +%T), kept running"' TERM
          # runner R hosts the R-th worker of this list (role names, admin 10-04); kit/lanes_gh.json has the same 16
          WORKERS="site_merge01 site_merge02 site_fix01 site_fix02 site_merge03 site_fix04 site_fix05 site_fix06 site_fix07 site_fix08 site_fix09 site_fix10 site_merge04 site_merge05 site_fix03 site_marketing01"
          W=$(echo $WORKERS | cut -d" " -f$(( RUNNER_NO + 1 )))
          [ -n "$W" ] || { echo "runner $RUNNER_NO has no worker (R0-15)"; exit 0; }
          for n in $W; do start $n; sleep 20; done
          echo "$W started on runner $RUNNER_NO"
          restarts=0; kills=0; tick=0
          res() { echo "res $(date -u +%T) mem_avail_mb=$(awk '/MemAvailable/{print int($2/1024)}' /proc/meminfo) disk_free_mb=$(df -m / | awk 'NR==2{print $4}') load=$(cut -d' ' -f1 /proc/loadavg) claude_procs=$(pgrep -u lab -fc claude)"; }
          res
          while [ $(date +%s) -lt $(( JOB_END - 900 )) ]; do
            for n in $W; do
              kill -0 "$(cat "$P/$n")" 2>/dev/null || { restarts=$((restarts + 1)); start $n; }
            done
            # watchdog: below 2.5 GB RAM or 2 GB disk, kill the heaviest worker process (its row is retried) so the runner lives.
            # 10-03: runner B lost its runner when RAM fell 14 GB -> 0.6 GB between two 60 s checks; now every 10 s.
            if [ "$(awk '/MemAvailable/{print int($2/1024)}' /proc/meminfo)" -lt 2500 ] || [ "$(df -m / | awk 'NR==2{print $4}')" -lt 2000 ]; then
              v=$(ps -u lab -o pid=,rss= --sort=-rss | awk 'NR==1{print $1}')
              [ -n "$v" ] && sudo kill -9 "$v" && kills=$((kills + 1)) && echo "watchdog killed 1 worker process" && res
              [ "$(df -m / | awk 'NR==2{print $4}')" -lt 2000 ] && sudo sh -c 'rm -rf /home/lab/.cache/* /home/lab/.npm/_cacache 2>/dev/null'
            fi
            tick=$((tick + 1)); [ $((tick % 30)) -eq 0 ] && res
            sleep 10 & wait $!
          done
          while pgrep -f "run_gh.sh site_" > /dev/null; do sleep 30 & wait $!; done
          echo "all workers ended, restarts=$restarts watchdog_kills=$kills"
      - name: summary (counts only)
        if: always()
        run: |
          for d in $(sudo sh -c 'ls -d /home/lab/sitefleet/site_*/ 2>/dev/null'); do
            sudo test -f "$d/logs/runner.log" || continue
            echo "$(basename "$d"): starts=$(sudo grep -c ' start ' "$d/logs/runner.log") ends=$(sudo grep -c ' end ' "$d/logs/runner.log") progress=$(sudo grep -c ' progress ' "$d/logs/runner.log")"
          done

  # __B4L_STORM_RESPAWN__ (engine's pattern): the next window, only before the deadline. A cancelled run (stop) does not respawn.
  respawn:
    needs: [wave]
    if: ${{ always() && !cancelled() && inputs.until != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: next window
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNERS: ${{ inputs.runners }}
          UNTIL: ${{ inputs.until }}
          MODEL: ${{ inputs.model }}
        run: |
          if [ $(( UNTIL - $(date +%s) )) -lt 1800 ]; then echo "storm deadline reached, no respawn"; exit 0; fi
          gh workflow run site_storm.yml -R "$GITHUB_REPOSITORY" -f runners="$RUNNERS" -f until="$UNTIL" -f model="$MODEL" && echo "next window dispatched" || echo "::warning::respawn dispatch failed"
